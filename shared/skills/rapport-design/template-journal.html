<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal du matin — {{DATE}}</title>
<style>
:root{--fond:#FBFAF7;--encre:#121212;--texte:#2B2B2B;--doux:#4A4A4A;--filet:#D9D6CF;--rubrique:#1F3A5F}
*{box-sizing:border-box}
body{margin:0;background:var(--fond);color:var(--encre);font-family:Georgia,'Times New Roman',serif}
.bandeau{background:var(--rubrique);color:#fff;padding:10px 18px;font:600 11px/1.2 -apple-system,'Segoe UI',sans-serif;letter-spacing:.1em;text-transform:uppercase}
main{max-width:680px;margin:0 auto;padding:20px 18px 40px}
.k{font:600 11px/1.3 -apple-system,'Segoe UI',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--rubrique);margin:0 0 6px}
h1{font-size:32px;line-height:1.08;margin:6px 0 10px}
h2{font-size:21px;line-height:1.2;margin:0 0 8px}
p{font-size:16px;line-height:1.55;color:var(--texte);margin:0 0 10px}
.meta{font:500 12px/1.4 -apple-system,'Segoe UI',sans-serif;color:var(--doux)}
.double{border-top:3px double var(--encre);margin:8px 0 18px}
.filet{border-top:1px solid var(--encre);margin:22px 0}
.bref{background:#fff;border:1px solid var(--encre);padding:14px}
.encadre{background:#EEF2F6;padding:16px}
.tag{display:inline-block;font:600 10px/1 -apple-system,'Segoe UI',sans-serif;letter-spacing:.08em;padding:3px 6px;border:1px solid #1E5E3A;color:#1E5E3A;margin-right:6px}
.tag.probable{border-style:dashed;border-color:#8A4F0F;color:#8A4F0F}
.tag.verifier{border-style:dotted;border-color:#8A1C2B;color:#8A1C2B}
details{border:1px solid var(--filet);background:#fff;padding:10px 12px}
summary{font:600 13px/1.4 -apple-system,'Segoe UI',sans-serif;cursor:pointer}
a{color:var(--rubrique)}
ul.sources{padding-left:18px;font:500 13px/1.5 -apple-system,'Segoe UI',sans-serif}
</style>
</head>
<body>
<div class="bandeau">Journal du matin</div>
<main>
<p class="meta">{{DATE_LONGUE}} · {{MINUTES}} min de lecture</p>
<h1>Ce qu'il faut savoir ce matin</h1>
<div class="double"></div>

<section class="bref">
<p class="k">En bref</p>
<p>1. …</p><p>2. …</p><p>3. …</p>
</section>

<div class="filet"></div>
<section>
<p class="k">Éco &amp; marchés · 3 min</p>
<h2>Titre</h2>
<p>Texte.</p>
<p class="meta"><span class="tag">CERTAIN</span>raison · source datée</p>
</section>

<!-- Répéter une <section> par rubrique, séparées par <div class="filet"></div> -->

<div class="filet"></div>
<section>
<p class="k">Sources</p>
<ul class="sources"><li><a href="#">Titre — Source, date</a></li></ul>
<p class="meta">Inaccessibles : …</p>
</section>

<div class="filet"></div>
<p class="meta">Cette édition t'a servi ? Utile · Bof · Inutile</p>
</main>
</body>
</html>
